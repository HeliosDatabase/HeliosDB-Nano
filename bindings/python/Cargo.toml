[package]
name = "heliosdb-nano-py"
version = "4.5.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "In-process Python binding for HeliosDB-Nano's embedded database"
repository = "https://github.com/HeliosDatabase/HeliosDB-Nano"

[lib]
# The importable Python module name. Must match the `#[pymodule]` fn and pyclass `module`.
name = "heliosdb_nano"
crate-type = ["cdylib"]

[dependencies]
# Aliased: the importable Python module (and the `#[pymodule]` fn) is `heliosdb_nano`,
# which would otherwise collide with the crate name.
heliosdb_core = { package = "heliosdb-nano", path = "../.." }
# abi3-py38: one wheel for CPython >= 3.8. extension-module: don't link libpython
# (symbols are resolved by the interpreter at import), which also lets plain
# `cargo build` produce the cdylib without Python dev headers.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
