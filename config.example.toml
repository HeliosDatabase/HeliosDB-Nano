# HeliosDB Nano Configuration File (v2.1)
#
# This is a comprehensive example configuration file showing all available
# options for HeliosDB Nano. Copy this file to config.toml and customize
# as needed for your deployment.

# ============================================================================
# PROFILE (top-level key — must appear before any [section])
# ============================================================================
# Named settings bundle. One-line tradeoffs:
# - "safe":     wal_sync_mode=sync, time_travel on — slowest writes, fsync per
#               operation (the built-in defaults).
# - "balanced": wal_sync_mode=group_commit, time_travel on — process-crash
#               safe; a power loss can lose the last commit window.
# - "fast":     group_commit, time_travel OFF, durable_commit off — fastest
#               writes; no AS OF time-travel queries, power loss can lose
#               recent commits.
# - "fast_ingest": async WAL, time_travel OFF, durable_commit off, Lz4 SSTs and
#               a larger cache — opt-in bulk-load bundle for REGENERABLE data.
#               Everything "fast" gives up, plus a crash can lose more than the
#               last commit window (async WAL).
# - "agent":    wal_sync_mode=group_commit, time_travel on — for AI-agent
#               workloads: branchable sandboxes (CREATE DATABASE BRANCH —
#               branching is always available; AS OF branch anchors need
#               time_travel), AS OF time-travel queries, and HNSW vector
#               search, with group-commit throughput for chatty tool-call
#               write patterns. Storage values match "balanced"; the named
#               profile pins the agent feature bundle. See docs/llms.txt.
# Precedence: a profile only fills in [storage] keys you do NOT set
# explicitly below — explicit per-field values always win.
# WHAT A PROFILE NEVER CHANGES: constraint enforcement. PRIMARY KEY, UNIQUE,
# FOREIGN KEY and CHECK are enforced identically under every profile — what you
# trade for speed is durability and history, never correctness. (Before the fix
# noted in CHANGELOG "Unreleased", this was not true: with time_travel OFF —
# i.e. under "fast" and "fast_ingest" — the storage engine's non-versioned
# insert arm skipped the PK/UNIQUE check, so REST writes, dump RESTORE, the
# protocol adapters and materialized-view refresh could persist duplicate
# primary keys. SQL and wire clients were never affected.)
# NOTE: none of the profiles force power-loss durable commits. If you need
# commits to survive power loss (not just process crashes), also set
# storage.durable_commit = true (available since v3.44.0; "safe" profile
# users typically want this).
# profile = "balanced"

# ============================================================================
# STORAGE CONFIGURATION
# ============================================================================
[storage]
# Database storage path (None or omit for in-memory database)
path = "./heliosdb-data"

# Memory-only mode (overrides path setting)
memory_only = false

# Write-Ahead Log (WAL) configuration
# WAL provides durability and crash recovery
wal_enabled = true

# WAL synchronization mode:
# - "sync": Synchronous (safest, slowest) - fsync on every write
# - "async": Asynchronous (faster, less safe) - OS-managed flush
# - "group_commit": Batch operations (balanced performance/safety)
wal_sync_mode = "sync"

# Maximum memory for cache (in bytes)
# Default: 512MB (536870912 bytes)
cache_size = 536870912

# Default compression type:
# - "None": No compression
# - "Zstd": Zstandard compression (recommended, good ratio and speed)
# - "Lz4": LZ4 compression (faster, lower ratio)
compression = "Zstd"

# Enable automatic time-travel versioning
# When true, all insert/update operations create versioned snapshots
# for time-travel queries (AS OF TIMESTAMP/TRANSACTION/SCN)
# This flag selects which storage insert path runs, but it does NOT change what
# is enforced: PRIMARY KEY / UNIQUE are checked before the write on every path
# at either setting. (Setting it to false used to disable that check for the
# non-SQL insert entry points — see CHANGELOG "Unreleased".)
time_travel_enabled = true

# W3.2: single-copy latest version. When true, a versioned main-branch INSERT
# skips the full `v:` row copy (~65% of INSERT byte volume on the measured
# shapes) and writes only a flag-bearing `v_idx:` event; the value is served
# from `data:` until the row's first mutation materializes the real `v:`. Only
# meaningful when time_travel_enabled = true.
#
# Default: false. Enabling it is a ONE-WAY, release-noted decision: rows written
# elided cannot be read correctly by a binary that predates W3.2 (only `AS OF`
# at the insert timestamp of a never-mutated elided row is affected — current
# reads are unaffected). The downgrade escape hatch is dump/restore. The flag is
# per-row and durable, so toggling this back off leaves already-elided rows
# elided and simply stops eliding new inserts (no migration).
elide_latest_version = false

# Query timeout in milliseconds (None or 0 for unlimited)
# Queries exceeding this duration will be automatically terminated
# Recommended: 30000 (30 seconds) for production
query_timeout_ms = 0

# Statement timeout in milliseconds (None or 0 for unlimited)
# Currently not implemented, reserved for future use
statement_timeout_ms = 0

# Transaction isolation level. HeliosDB-Nano implements SNAPSHOT ISOLATION:
# - "READ_UNCOMMITTED": Not fully supported, maps to READ_COMMITTED
# - "READ_COMMITTED": Standard PostgreSQL default; fresh snapshot per statement
# - "REPEATABLE_READ": One snapshot per transaction, first-committer-wins on
#                      write-write conflicts (loser gets 40001)
# - "SERIALIZABLE":    ACCEPTED AS A NAME, SERVED AS SNAPSHOT ISOLATION. There
#                      is no read-set tracking (no SSI), so this is identical to
#                      REPEATABLE_READ and it does NOT prevent WRITE SKEW: two
#                      transactions can each read the rows the other is about to
#                      change and both commit. See serializable_policy below.
transaction_isolation = "READ_COMMITTED"

# What to do when a client asks for SERIALIZABLE (task #103):
# - "warn"  (default) run it as snapshot isolation and say so — a PostgreSQL
#                     WARNING on the wire naming write skew, plus a server-log
#                     WARN line.
# - "error"           refuse `BEGIN ... ISOLATION LEVEL SERIALIZABLE`, for
#                     deployments that need the real guarantee or nothing.
# There is no silent-accept value: a client asking for serializability is never
# left believing it got it. Real SSI is a separate, unshipped milestone.
serializable_policy = "warn"

# Slow query log threshold in milliseconds.
# Queries exceeding this threshold are logged at WARN level with their SQL
# text (truncated to 200 chars), duration, and row count.
# Omit for the default (1000 = 1 second). Visible by default: the server
# logs at WARN level when RUST_LOG is unset (set RUST_LOG to override).
slow_query_threshold_ms = 1000

# Fsync the RocksDB WriteBatch at transaction COMMIT, making commits
# power-loss durable (v3.44.0+). Default false: commits are process-crash
# safe (RocksDB WAL) but a power loss can lose the last commit window.
# Recommended together with profile = "safe" when durability matters more
# than write latency.
durable_commit = false

# How a snapshot / AS OF read decodes rows written under an OLDER schema than
# the current catalog (after ALTER ADD/DROP COLUMN). A version-resolved
# (open-snapshot / AS OF) or branch-forked read can surface a pre-ALTER tuple
# that has fewer columns than the table now has.
#   "strict"    = decode at the stored arity; projecting the added column errors
#                 "Column index N out of bounds in tuple" (pre-W3.5 behavior;
#                 kept as a rollback).
#   "null_pad"  = Stage 1 (default): shape the row to the current width — pad an
#                 ADD-COLUMN-narrower row with NULL (a pre-ALTER snapshot projects
#                 the added column as NULL, never the post-snapshot DEFAULT
#                 backfill; isolation-preserving), and truncate a DROP-COLUMN-wider
#                 row (a pre-DROP snapshot / branch fork legitimately resolves a
#                 wider old version) to the current width, matching the pre-W3.5
#                 projection.
#   "versioned" = Stage 2 (RESERVED, not yet implemented): resolve the schema
#                 as-of the snapshot (pre-ALTER column set; the new column is not
#                 projected). Setting this value is rejected at config parse.
snapshot_schema_evolution = "null_pad"

# ============================================================================
# ENCRYPTION CONFIGURATION
# ============================================================================
[encryption]
# Enable encryption at rest (AES-256-GCM on stored VALUES).
#
# Sealed: row images, MVCC version history, row-id counters, logical-WAL
# entries, branch row overlays, materialized-view deltas, the catalog and
# durable index snapshots — on every write route.
#
# NOT sealed: RocksDB KEYS (table/column names, row ids and timestamps stay
# visible); the column sidecars used by non-default `STORAGE` modes
# (COLUMNAR / DICTIONARY / CONTENT_ADDRESSED), whose payloads live outside the
# row; HNSW graph snapshot files under <data_dir>/hnsw_snapshots/; backup dumps
# written by [dump]; and the replication link, which ships rows in the clear
# (use TLS). See the "Encryption at rest" section of the README.
#
# Enabling this on an EXISTING database seals new writes only; data already on
# disk is read as-is and is never rewritten.
#
# Once enabled, the key is checked at every open against a sealed sentinel: a
# wrong or rotated key is refused rather than silently returning unreadable
# rows, and an encrypted directory cannot be opened with encryption disabled.
# Key ROTATION is not implemented — see the note on the GCM nonce budget below.
enabled = false

# Encryption algorithm (currently only AES-256-GCM supported)
algorithm = "Aes256Gcm"

# Key rotation interval in days.
#
# NOT IMPLEMENTED IN THIS BUILD. The value is parsed and then read by nothing:
# no timer, no re-key, no dual-key read path. Re-keying today means dumping the
# database and restoring it under a new key. Left in place because removing it
# would break existing config files.
#
# NONCE BUDGET, which is the reason rotation matters. AES-256-GCM is used here
# with a random 96-bit nonce under one static key. NIST SP 800-38D §8.3 caps
# random-nonce GCM at 2^32 invocations per key before the collision probability
# stops being negligible. Every sealed value costs one invocation, so a
# write-heavy deployment should track its cumulative write count against that
# bound and re-key (dump/restore) before approaching it.
rotation_interval_days = 90

# ---------------------------------------------------------------------------
# PER-KEY INVOCATION LIMIT — read this before running encryption at rest on a
# high-write workload.
#
# Every encrypted value gets a fresh, fully RANDOM 96-bit nonce under one static
# key. NIST SP 800-38D section 8.3 caps random-nonce AES-GCM at 2^32 (~4.3
# billion) invocations per key: past that the birthday bound makes a nonce
# COLLISION likely, and a GCM nonce collision leaks the XOR of the two
# plaintexts and compromises the authentication subkey.
#
# Count invocations, not rows. Roughly, per row: 1 for the row image (its MVCC
# version twin reuses the same sealed bytes), +1 for an UPDATE's preserved
# pre-image, +1 per logical-WAL entry (storage.wal_enabled, on by default), and
# 1 per row-counter flush (every 64 inserts). A database sustaining 10,000 row
# writes per second reaches 2^32 in roughly five days.
#
# There is no automatic rotation to fall back on (see rotation_interval_days
# above), so on a workload of that size plan a periodic dump-and-restore under a
# fresh key, or keep encryption at rest scoped to a database that stays well
# under the limit.
# ---------------------------------------------------------------------------

# Key source configuration
# Option 1: Environment variable
[encryption.key_source]
Environment = "HELIOSDB_ENCRYPTION_KEY"

# Option 2: File path (uncomment to use)
# [encryption.key_source]
# File = "/secure/path/to/encryption.key"

# Option 3: Cloud KMS (uncomment to use)
# [encryption.key_source.Kms]
# provider = "aws"  # aws, azure, or gcp
# key_id = "arn:aws:kms:us-east-1:123456789:key/abc-123"

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
[server]
# Listen address (use "0.0.0.0" to accept connections from any IP)
listen_addr = "127.0.0.1"

# PostgreSQL protocol port
port = 5432

# Oracle TNS protocol port. Currently unused/reserved: no Oracle listener is
# started by `heliosdb-nano start`, and this value is never read at startup.
oracle_port = 1521

# Maximum concurrent connections
max_connections = 100

# Maximum rows buffered in memory while decoding a single COPY ... FROM STDIN
# stream. The wire decoder parses each CopyData frame into typed rows and drops
# the raw bytes as it goes, so peak memory tracks the parsed batch rather than
# (~4-6x) the whole stream buffered as one byte vector. If a COPY would buffer
# more than this many rows the server aborts it with a clean error and applies
# zero rows. Set to 0 to disable the cap (unbounded — not recommended on
# memory-constrained hosts).
copy_max_buffered_rows = 10000000

# Maximum bytes accumulated for a SINGLE in-progress COPY ... FROM STDIN record
# before the server aborts the copy with a clean error and applies zero rows.
# copy_max_buffered_rows above only counts COMPLETED rows; this caps the
# partial-record state it never sees — an unterminated text line, or an unclosed
# quoted CSV field — so a stream with no record separator (e.g. a multi-GB
# single-line blob accidentally loaded in text mode) cannot accumulate unbounded.
# Default 1 GiB matches PostgreSQL's own per-field size limit. Set to 0 to
# disable (unbounded — not recommended on memory-constrained hosts).
copy_max_record_bytes = 1073741824

# Enable TLS/SSL
tls_enabled = false

# TLS certificate path (required if tls_enabled = true)
# tls_cert_path = "/path/to/cert.pem"

# TLS private key path (required if tls_enabled = true)
# tls_key_path = "/path/to/key.pem"

# ============================================================================
# PERFORMANCE CONFIGURATION
# ============================================================================
[performance]
# Number of worker threads (default: number of CPU cores)
# Set to 0 to use all available cores
worker_threads = 0

# Query timeout in seconds (legacy setting, use storage.query_timeout_ms instead)
query_timeout_secs = 300

# Enable SIMD optimizations for vector operations
simd_enabled = true

# Enable parallel query execution
parallel_query = true

# Read-hot-path lock-contention census (diagnostic; W3.1 plateau attribution).
# When enabled, per-query acquisitions of the plan/parse/result cache shard
# mutexes, the ART index registry, and the prepared-statement fast-select
# registry try-lock first; a would-block bumps a relaxed contention counter and
# accumulates blocked-wait nanos. Inspect via
#   SELECT * FROM heliosdb_lock_census;
# Requires a build with the `lock-census` cargo feature; on any other build
# this flag is ignored and carries zero runtime cost. Leave false in production.
lock_census = false

# Per-statement-class write-volume census (diagnostic; W3.2 version-format
# quantification). When enabled, durable writes are counted by statement class
# (single INSERT, multi-row INSERT, COPY, UPDATE, DELETE) and split across three
# key families: the current row (`data:`), the time-travel version chain
# (`v:`/`v_idx:` + COPY `vmeta:` marker), and secondary-index (ART) keys. Use it
# to see what fraction of INSERT byte volume is the `v:` duplicate of every row.
# Inspect via
#   SELECT * FROM heliosdb_write_volume;
# The version-chain counter reads zero under the `fast`/`fast_ingest` profiles
# (time_travel_enabled = false) — those profiles write no `v:`/`v_idx:` at all;
# version bytes appear only for time-travel-on configs (default/safe/balanced/agent).
# Runtime-only (no build feature required); zero-cost when off (one relaxed
# atomic load per write funnel). Leave false in production.
write_volume_stats = false

# COPY fast-path phase-timing census (diagnostic; W3.4 ART-maintenance
# attribution). When enabled, the COPY bulk-insert funnel's wall time is split
# across its phases — wire decode, type conversion, CHECK/FK constraint checks,
# PK auto-fill, the data:/version WriteBatch build, the durable RocksDB commit,
# and per-row ART secondary-index maintenance — to measure what share of a COPY
# is index maintenance. Inspect via
#   SELECT * FROM heliosdb_copy_phase_stats;
# ART share = art_maintain.total_nanos / (total.total_nanos + decode.total_nanos).
# The batch_build/commit/art_maintain phases are shared with multi-row
# INSERT ... VALUES, so read the view after a COPY-only workload. Runtime-only
# (no build feature required); zero-cost when off (one relaxed atomic load per
# phase boundary). Leave false in production.
copy_phase_stats = false

# ============================================================================
# AUDIT CONFIGURATION
# ============================================================================
# If the [audit] section is present, ALL fields below (including the
# [audit.capture_metadata] sub-table) are required. Omit the whole section
# to use the built-in defaults.
[audit]
# Enable audit logging
enabled = false

# Event classes to log
log_ddl = true           # CREATE, DROP, ALTER
log_dml = true           # INSERT, UPDATE, DELETE
log_select = false       # SELECT queries (can be very verbose)
log_transactions = false # BEGIN, COMMIT, ROLLBACK
log_auth = true          # Authentication events

# Retention period in days (0 = infinite)
retention_days = 90

# Async buffer size (number of events before flushing)
async_buffer_size = 100

# Enable cryptographic checksums on audit records
enable_checksums = true

# Truncate long queries to this length (0 = no truncation)
max_query_length = 10000

[audit.capture_metadata]
capture_client_ip = true
capture_application_name = true
capture_database_name = true
capture_execution_time = true
capture_custom_fields = false

# ============================================================================
# OPTIMIZER CONFIGURATION (v2.1)
# ============================================================================
[optimizer]
# Enable query optimizer
enabled = true

# Enable/disable specific scan and join methods
enable_seqscan = true
enable_indexscan = true
enable_hashjoin = true
enable_mergejoin = true
enable_nestloop = true

# Cost model parameters (PostgreSQL-compatible)
# Adjust these to tune optimizer behavior for your workload
seq_page_cost = 1.0          # Cost of sequential page fetch
random_page_cost = 4.0       # Cost of random page fetch (SSD: 1.1, HDD: 4.0)
cpu_tuple_cost = 0.01        # Cost of processing one tuple
cpu_index_tuple_cost = 0.005 # Cost of processing one index tuple

# ============================================================================
# AUTHENTICATION CONFIGURATION (v2.1)
# ============================================================================
[authentication]
# Enable authentication
enabled = false

# Authentication method:
# - "trust": No authentication (dev mode only!)
# - "password": Password-based authentication
# - "jwt": JWT token authentication
# - "ldap": LDAP authentication
method = "trust"

# JWT configuration (only used if method = "jwt")
# jwt_secret = "your-secret-key-here-change-in-production"
jwt_expiration_secs = 86400  # 24 hours

# Password hash algorithm:
# - "argon2": Argon2 (recommended, most secure)
# - "bcrypt": BCrypt (good balance)
# - "pbkdf2": PBKDF2 (widely supported)
password_hash_algorithm = "argon2"

# Users file path (for file-based authentication)
# users_file = "/etc/heliosdb/users.json"

# ----------------------------------------------------------------------------
# SQL ROLES AND GRANTS: STORED AND INTROSPECTABLE, **NOT ENFORCED**
# ----------------------------------------------------------------------------
# HeliosDB Nano persists CREATE/ALTER/DROP ROLE and GRANT/REVOKE so that
# pg_roles, pg_user, pg_authid, information_schema.table_privileges /
# role_table_grants and MySQL SHOW GRANTS report what was actually requested.
#
# NO PRIVILEGE IS CHECKED ANYWHERE. There is no permission check on any read
# or write path. A GRANT confers nothing; a REVOKE removes nothing. Do not
# treat a row in a privilege view as an access control. Enforcement is a
# tracked follow-up (ROADMAP_V5).
#
# legacy_acl_noop restores the pre-4.20 leniency for deployments whose scripts
# depended on it:
#   false (default) - GRANT/REVOKE naming a role or table that does not exist
#                     raise an error, and `SET ROLE <name>` over the PostgreSQL
#                     wire raises 0A000 feature_not_supported.
#   true            - unknown grantees/objects are skipped and the statement
#                     succeeds; `SET ROLE` returns the old silent "SET" ack.
#                     (That old ack was a FALSE claim that the session had
#                     dropped privileges — enable this only to unblock an
#                     existing script.)
# legacy_acl_noop = false

# ============================================================================
# COMPRESSION CONFIGURATION (v2.1)
# ============================================================================
[compression]
# Default compression type for new tables
# Options: "None", "Zstd", "Lz4"
default_type = "Zstd"

# Compression level (1-22 for Zstd, higher = better ratio but slower)
# Recommended: 3 for balanced performance, 9+ for maximum compression
level = 3

# Enable ALP (Adaptive Lossless floating-Point) compression
# Specialized compression for numeric columns
enable_alp = true

# Enable FSST (Fast Static Symbol Table) compression
# Specialized compression for string columns
enable_fsst = true

# Minimum data size to trigger compression (bytes)
# Small data blocks aren't worth compressing
min_size_bytes = 1024

# ============================================================================
# MATERIALIZED VIEW CONFIGURATION (v2.1)
# ============================================================================
[materialized_views]
# NOTE: automatic refresh only runs when the embedded library API
# `EmbeddedDatabase::start_auto_refresh()` is called. There is no CLI flag, SQL
# statement or HTTP endpoint that starts it, and the settings below do nothing
# until it is running. Opt a view in with
# `CREATE MATERIALIZED VIEW … WITH (auto_refresh = true)` (either before or after
# the query) or `ALTER MATERIALIZED VIEW … SET (auto_refresh = true)`.

# RESERVED — parsed but not yet wired to anything. Setting it true does NOT opt
# new materialized views into auto-refresh; use the WITH clause above.
auto_refresh_default = false

# CPU ceiling for refresh work. The refresh scheduler skips a batch, and the
# staleness worker skips a check, while smoothed system CPU is above this.
# Set it high if refreshes must keep up on a busy host — at 15 on a loaded
# machine, opted-in views may never refresh.
default_max_cpu_percent = 15

# How often the staleness worker scans for stale views AND how often the
# scheduler drains its refresh queue (seconds). Effectively the upper bound on
# how long a stale view waits.
refresh_check_interval_secs = 60

# Maximum concurrent refresh operations. Each one is a FULL recompute of the
# view's query with an atomic row swap.
max_concurrent_refreshes = 2

# ============================================================================
# VECTOR INDEX CONFIGURATION (v2.1)
# ============================================================================
[vector]
# Default vector index type:
# - "flat": Brute force, exact search (small datasets)
# - "hnsw": HNSW approximate search (recommended, fast)
# - "ivf": Inverted file index (large datasets)
default_index_type = "hnsw"

# HNSW parameters
# ef_construction: Higher = better recall but slower build (default: 200)
hnsw_ef_construction = 200

# M: Number of connections per layer (default: 16)
# Higher M = better recall but more memory
hnsw_m = 16

# Enable Product Quantization (PQ) for vector compression
# Provides 8-16x compression with minimal accuracy loss
enable_pq = true

# PQ subvector count (default: 8)
# Must divide vector dimension evenly
pq_subvectors = 8

# PQ bits per subvector (default: 8, which gives 256 centroids)
pq_bits = 8

# ============================================================================
# EXAMPLE DEPLOYMENT CONFIGURATIONS
# ============================================================================

# --- Development Configuration ---
# Uncomment and modify for local development:
# [storage]
# memory_only = true
# wal_enabled = false
# [server]
# listen_addr = "127.0.0.1"
# [authentication]
# method = "trust"

# --- Production Configuration ---
# Uncomment and modify for production:
# [storage]
# wal_sync_mode = "group_commit"
# query_timeout_ms = 30000
# [server]
# listen_addr = "0.0.0.0"
# tls_enabled = true
# tls_cert_path = "/etc/heliosdb/ssl/cert.pem"
# tls_key_path = "/etc/heliosdb/ssl/key.pem"
# [authentication]
# enabled = true
# method = "jwt"
# jwt_secret = "CHANGE-THIS-SECRET-IN-PRODUCTION"
# [encryption]
# enabled = true
# [audit]
# enabled = true
# log_path = "/var/log/heliosdb/audit.log"

# --- High-Performance Configuration (SSD) ---
# Uncomment for SSD-optimized settings:
# [optimizer]
# random_page_cost = 1.1  # SSDs have low random access cost
# [performance]
# worker_threads = 0      # Use all cores
# [storage]
# cache_size = 2147483648 # 2GB cache

# NOTE: The former [ai], [ai.llm], [ai.embedding], [rag], [search], [wasm],
# [mcp], and [storage.tuning] sections are reserved for HeliosDB-Full and are
# not read by HeliosDB Nano.

# ============================================================================
# SESSION CONFIGURATION (v3.1.0 - Multi-User ACID)
# ============================================================================
[session]
# How long a session can be idle before timeout (seconds)
# Default: 3600 (1 hour)
timeout_secs = 3600

# Maximum sessions per user
# Default: 10
max_sessions_per_user = 10

# How often to clean up inactive sessions (seconds)
# Default: 300 (5 minutes)
cleanup_interval_secs = 300

# Maximum nested user-defined-function invocations on one thread.
# A CREATE FUNCTION body re-enters the parser, planner and executor, so a
# self-recursive function (`f()` whose body calls `f()`) would recurse until the
# thread's stack is exhausted — a process abort, not a SQL error. When this
# depth is reached the call fails loudly with a message naming this setting.
# Raise it for legitimately deep function nesting; lower it to fail faster on
# runaway recursion. Must be at least 1.
# Default: 32
udf_max_call_depth = 32

# ============================================================================
# LOCK CONFIGURATION (v3.1.0 - Multi-User ACID)
# ============================================================================
[locks]
# How long a same-row write waiter spins before timing out (milliseconds).
# A same-row write-write waiter can never be granted the lock while the holder
# stays open, so this bounds a FUTILE spin: a short bound turns a server-wide
# stall into a fast, retriable serialization failure (SQLSTATE 40001). The env
# var NANO_LOCK_TIMEOUT_MS overrides this value (env > config > default).
# Default: 1000 (1 second)
timeout_ms = 1000

# How often to check for deadlocks (milliseconds)
# Default: 100
deadlock_check_interval_ms = 100

# Maximum number of concurrent lock holders
# Default: 10000
max_lock_holders = 10000

# W3.3: auto-retry an AUTOCOMMIT statement that hits a same-row write conflict
# (serialization failure, SQLSTATE 40001) against a fresh snapshot. Retries are
# hard-bounded by this count; each waits a full-jitter exponential backoff
# (base..cap below) that yields the async worker so a starved holder can commit
# and release the row. 0 = OFF (surface 40001 to the client, today's behavior).
# Explicit transactions NEVER auto-retry regardless of this setting — the client
# owns their retry (the PostgreSQL contract).
# Default: 0
statement_retry_max = 0

# Base backoff between statement retries in milliseconds; grows exponentially
# with full jitter up to statement_retry_backoff_max_ms (anti-livelock).
# Default: 5
statement_retry_backoff_ms = 5

# Cap on the backoff sleep per statement retry (milliseconds). Must be >=
# statement_retry_backoff_ms.
# Default: 100
statement_retry_backoff_max_ms = 100

# ============================================================================
# DUMP CONFIGURATION (v3.1.0 - Memory-to-Disk Persistence)
# ============================================================================
[dump]
# Enable automatic dumps on a schedule
# Default: false
auto_dump_enabled = false

# Cron schedule for automatic dumps (requires auto_dump_enabled = true)
# Format: "minute hour day month weekday" (standard 5-field cron)
# Examples:
#   "0 */6 * * *"  - Every 6 hours
#   "0 2 * * *"    - Daily at 2:00 AM
#   "0 0 * * 0"    - Weekly on Sunday at midnight
# Default: "" (empty, no schedule)
schedule = "0 */6 * * *"

# Compression algorithm for dumps
# Options: "zstd", "gzip", "none"
# Default: "zstd"
compression = "zstd"

# Maximum size of a single dump file before rolling (MB)
# Default: 10000 (10 GB)
max_dump_size_mb = 10000

# Number of old dumps to keep (0 = keep all)
# Default: 10
keep_dumps = 10

# Directory to store dumps (relative or absolute path)
# Default: ".dumps"
dump_dir = ".dumps"

# ============================================================================
# RESOURCE QUOTA CONFIGURATION (v3.1.0 - Multi-User ACID)
# ============================================================================
[resource_quotas]
# Memory limit per user (MB)
# Prevents any single user from consuming all available memory
# Default: 1024 (1 GB)
memory_limit_per_user_mb = 1024

# Maximum concurrent queries per user
# Prevents query storms from a single user
# Default: 100
max_concurrent_queries = 100

# Query execution timeout (seconds)
# Queries exceeding this duration will be automatically terminated
# Default: 300 (5 minutes)
query_timeout_secs = 300
