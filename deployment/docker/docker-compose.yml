# Uses the published image. To build from source instead, uncomment `build:`.
services:
  heliosdb:
    image: ghcr.io/heliosdatabase/heliosdb-nano:latest
    # build:
    #   context: ../..
    #   dockerfile: deployment/docker/Dockerfile
    ports:
      - "5432:5432"  # PostgreSQL protocol
      # HTTP API (REST, branches, vectors) is unauthenticated and bound to
      # 127.0.0.1 in the container; to expose it on a trusted network set
      # HELIOSDB_HTTP_LISTEN=0.0.0.0 and uncomment:
      # - "8080:8080"
      - "3306:3306"  # MySQL protocol
    volumes:
      - heliosdb_data:/data
    environment:
      - HELIOSDB_LOG_LEVEL=info
      # Required: password for scram-sha-256 auth (trust auth is loopback-only)
      - HELIOSDB_PASSWORD=${HELIOSDB_PASSWORD:?set HELIOSDB_PASSWORD}
      # Optional: at-rest encryption key
      - HELIOSDB_ENCRYPTION_KEY=${HELIOSDB_ENCRYPTION_KEY:-}
    command: >
      start
      --data-dir /data
      --listen 0.0.0.0
      --port 5432
      --mysql
      --mysql-listen 0.0.0.0:3306
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  heliosdb_data:
    driver: local

