# Uses the published image. To build from source instead, uncomment `build:`.
#
# SECRETS
# -------
# The database password is supplied as a Docker secret and handed to the
# server through HELIOSDB_PASSWORD_FILE, so it never appears on the container's
# command line: `docker inspect` shows the file path, `ps` shows nothing. Create
# the secret file before `docker compose up` (the `secrets*` pattern in
# .gitignore keeps it out of git):
#
#   mkdir -p secrets
#   printf '%s' 'change-me' > secrets/heliosdb_password.txt
#
# Compose implements a file-based secret as a BIND MOUNT of the host file, so
# the host owner/mode carry into the container. The image runs as uid/gid 999
# (Dockerfile `USER heliosdb`), so a file left `0600` and owned by your host
# login is UNREADABLE to the server and it will exit. Make it 999-readable:
#
#   sudo chown 999:999 secrets/heliosdb_password.txt && chmod 600 secrets/heliosdb_password.txt
# or, without ownership changes:
#   chmod 644 secrets/heliosdb_password.txt   # world-readable on the host
#
# Kubernetes mounts its own Secret with mode 0444 by default; keep the
# HELIOSDB_PASSWORD_FILE environment variable below.
services:
  heliosdb:
    image: ghcr.io/heliosdatabase/heliosdb-nano:latest
    # build:
    #   context: ../..
    #   dockerfile: deployment/docker/Dockerfile
    # The default service uses password-authenticated PostgreSQL.
    # MySQL is omitted because its listener does not support authentication.
    ports:
      - "5432:5432"  # PostgreSQL protocol
      # HTTP is plaintext and all routes except /health require the configured
      # credential; 8080 stays unpublished and is bound to 127.0.0.1 inside the
      # container on purpose. (MCP /mcp accepts a bearer token via
      # HELIOSDB_MCP_TOKEN.)
      # - "8080:8080"
    volumes:
      - heliosdb_data:/data
    environment:
      - HELIOSDB_LOG_LEVEL=info
      # Password read from the mounted secret below; the entrypoint passes
      # --password-file to the server (never --password on argv).
      - HELIOSDB_PASSWORD_FILE=/run/secrets/heliosdb_password
      # Optional: at-rest encryption key. The server reads this variable by
      # default; it is not a command-line argument. For a file source instead,
      # mount a config with:
      #   [encryption]
      #   enabled = true
      #   key_source = { File = "/run/secrets/heliosdb_encryption_key" }
      # and add that file under `secrets:` below.
      # - HELIOSDB_ENCRYPTION_KEY=${HELIOSDB_ENCRYPTION_KEY:-}
    secrets:
      - heliosdb_password
    command: >
      start
      --data-dir /data
      --listen 0.0.0.0
      --port 5432
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

secrets:
  heliosdb_password:
    file: ./secrets/heliosdb_password.txt

volumes:
  heliosdb_data:
    driver: local

