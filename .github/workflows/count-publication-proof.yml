name: COUNT publication baseline/fix proof (no publish)
on:
  push:
    branches: ['ci/4420-count-publication-*']
permissions:
  contents: read
jobs:
  proof:
    name: ${{ matrix.role }} / ${{ matrix.config }} exact COUNT native regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        role: [baseline, fixed]
        config: [default, internal-tests]
        include:
          - role: baseline
            product: 9ba88f3c68cd4ed8c7dfd14127ba524751db8521
          - role: fixed
            product: b1cba858296db3db838660a83aa21557df2e3b90
    steps:
      - name: Preserve Git source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.product }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config libssl-dev cmake ninja-build
          dpkg-query -W -f='${Package}\t${Version}\n' > "$RUNNER_TEMP/count-proof-packages.txt"
      - name: Verify fixed controller and model
        working-directory: controller
        run: |
          python3 - <<'PYBOOT'
          import hashlib
          from pathlib import Path
          pairs = {
              '.github/4420-count-proof/controller.py': 'a9b5c2187910992f084699fe82c43fcacd9e5178acb8ef133d9d96a852edac4f',
              '.github/4420-count-proof/model.json': '44ab4b8c67e7a5b9c1fff85ac96c8e9c506bf2d4c6c545a2a2fba2f2923c20d5',
          }
          for name, wanted in pairs.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != wanted:
                  raise SystemExit('paired-proof bootstrap mismatch: ' + name)
          PYBOOT
      - name: Build, list and execute the exact five native tests / 88 cases
        env:
          NANO_COUNT_PROOF_ROLE: ${{ matrix.role }}
          NANO_COUNT_PROOF_CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/gpc/HDB/sprint/coordination
          touch /home/gpc/HDB/sprint/coordination/build.lock
          nano_count_unit="nano-count-proof-${GITHUB_RUN_ID}-${NANO_COUNT_PROOF_ROLE}-${NANO_COUNT_PROOF_CONFIG}"
          sudo systemd-run --unit "$nano_count_unit" --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE/controller" \
            -p MemoryMax=24G -p MemorySwapMax=0 -p KillMode=control-group \
            -p RuntimeMaxSec=5700 -p TimeoutStopSec=30 \
            --setenv="PATH=$PATH" --setenv="CARGO_HOME=$HOME/.cargo" \
            --setenv="RUSTUP_HOME=$HOME/.rustup" --setenv=RUSTUP_TOOLCHAIN=1.95.0 \
            --setenv="GITHUB_SHA=$GITHUB_SHA" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=PYTHONUNBUFFERED=1 \
            python3 .github/4420-count-proof/controller.py \
              --controller "$GITHUB_WORKSPACE/controller" --product "$GITHUB_WORKSPACE/product" \
              --role "$NANO_COUNT_PROOF_ROLE" --config "$NANO_COUNT_PROOF_CONFIG" \
              --out "$RUNNER_TEMP/count-proof-$NANO_COUNT_PROOF_ROLE-$NANO_COUNT_PROOF_CONFIG" \
              --model-sha256 44ab4b8c67e7a5b9c1fff85ac96c8e9c506bf2d4c6c545a2a2fba2f2923c20d5
      - name: Preserve raw focused proof (including expected-red baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-publication-proof-${{ matrix.role }}-${{ matrix.config }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/count-proof-packages.txt
            ${{ runner.temp }}/count-proof-${{ matrix.role }}-${{ matrix.config }}/*.json
            ${{ runner.temp }}/count-proof-${{ matrix.role }}-${{ matrix.config }}/*.stdout
            ${{ runner.temp }}/count-proof-${{ matrix.role }}-${{ matrix.config }}/*.stderr
            ${{ runner.temp }}/count-proof-${{ matrix.role }}-${{ matrix.config }}/native-libtest.elf
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  both-roles:
    name: All four focused role/config proofs required (no release acceptance)
    if: always()
    needs: proof
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a partial or invalid pair
        env:
          PROOF_RESULT: ${{ needs.proof.result }}
        run: |
          test "$PROOF_RESULT" = success
