name: Focused public native perf smoke (no publish)
on:
  push:
    branches: ['ci/4420-public-smoke-*']
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Preserve exact Git source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 00b58922b030797da5b262dd680442eb93f37038
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config libssl-dev cmake ninja-build
          dpkg-query -W -f='${Package}\t${Version}\n' > "$RUNNER_TEMP/public-smoke-packages.txt"
      - name: Verify frozen bootstrap
        working-directory: controller
        run: |
          python3 - <<'PYBOOT'
          import hashlib
          from pathlib import Path
          pairs = {
              '.github/4420-public-smoke-proof/controller.py': '294e348bf41c720ac10fce93377755643a7f3f56091d47640ced16d6678831e8',
              '.github/4420-public-smoke-proof/model.json': '95dd00581bac8e0aedc43f94d7c7bdc8ea389444c61e79dafd957b1134f0223e',
          }
          for name, wanted in pairs.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != wanted:
                  raise SystemExit('Public proof bootstrap input changed: ' + name)
          PYBOOT
      - name: Run unchanged V8 public smoke recipe
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/gpc/HDB/sprint/coordination
          touch /home/gpc/HDB/sprint/coordination/build.lock
          nano_public_unit="nano-public-smoke-${GITHUB_RUN_ID}"
          sudo systemd-run --unit "$nano_public_unit" --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE/controller" \
            -p MemoryMax=24G -p MemorySwapMax=0 -p KillMode=control-group \
            -p RuntimeMaxSec=8400 -p TimeoutStopSec=30 \
            --setenv="PATH=$PATH" --setenv="CARGO_HOME=$HOME/.cargo" \
            --setenv="RUSTUP_HOME=$HOME/.rustup" --setenv=RUSTUP_TOOLCHAIN=1.95.0 \
            --setenv="GITHUB_SHA=$GITHUB_SHA" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=PYTHONUNBUFFERED=1 \
            python3 .github/4420-public-smoke-proof/controller.py \
              --controller "$GITHUB_WORKSPACE/controller" --product "$GITHUB_WORKSPACE/product" \
              --out "$RUNNER_TEMP/public-smoke-proof" --model-sha256 95dd00581bac8e0aedc43f94d7c7bdc8ea389444c61e79dafd957b1134f0223e
      - name: Preserve all native process, table, source and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-smoke-packages.txt
            ${{ runner.temp }}/public-smoke-proof/*.json
            ${{ runner.temp }}/public-smoke-proof/*.stdout
            ${{ runner.temp }}/public-smoke-proof/*.stderr
            ${{ runner.temp }}/public-smoke-proof/capture/**
            ${{ runner.temp }}/public-smoke-proof/public-perf-smoke/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
