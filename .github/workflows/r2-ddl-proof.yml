name: Focused real R2 daemon DDL proof (no publish)
on:
  push:
    branches: ['ci/4420-r2-ddl-proof-*']
permissions:
  contents: read
jobs:
  daemon-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Preserve exact Git source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 5451dd091cebebc3dd6bf10900f3f19a53686a5f
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config libssl-dev cmake ninja-build
          dpkg-query -W -f='${Package}\t${Version}\n' > "$RUNNER_TEMP/r2-ddl-packages.txt"
      - name: Verify frozen bootstrap
        working-directory: controller
        run: |
          python3 - <<'PYBOOT'
          import hashlib
          from pathlib import Path
          pairs = {
              '.github/4420-r2-ddl-proof/controller.py': 'd478c33415c3a7967d5a0306e15bf39af9b8f5eeaa245f89b8b47c3a3200e6e6',
              '.github/4420-r2-ddl-proof/model.json': 'df5af55916c8540de0db9f21e1e0b0fef60a69b8bf018242e796bf09d4741e2b',
          }
          for name, wanted in pairs.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != wanted:
                  raise SystemExit('R2 bootstrap input changed: ' + name)
          PYBOOT
      - name: Run unchanged V7 four-command daemon stage
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/gpc/HDB/sprint/coordination
          touch /home/gpc/HDB/sprint/coordination/build.lock
          nano_r2_unit="nano-r2-ddl-${GITHUB_RUN_ID}"
          sudo systemd-run --unit "$nano_r2_unit" --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE/controller" \
            -p MemoryMax=24G -p MemorySwapMax=0 -p KillMode=control-group \
            -p RuntimeMaxSec=8400 -p TimeoutStopSec=30 \
            --setenv="PATH=$PATH" --setenv="CARGO_HOME=$HOME/.cargo" \
            --setenv="RUSTUP_HOME=$HOME/.rustup" --setenv=RUSTUP_TOOLCHAIN=1.95.0 \
            --setenv="GITHUB_SHA=$GITHUB_SHA" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=PYTHONUNBUFFERED=1 \
            python3 .github/4420-r2-ddl-proof/controller.py \
              --controller "$GITHUB_WORKSPACE/controller" --product "$GITHUB_WORKSPACE/product" \
              --out "$RUNNER_TEMP/r2-ddl-proof" --model-sha256 df5af55916c8540de0db9f21e1e0b0fef60a69b8bf018242e796bf09d4741e2b
      - name: Preserve all raw R2 stage and daemon outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-ddl-four-commands-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r2-ddl-packages.txt
            ${{ runner.temp }}/r2-ddl-proof/*.json
            ${{ runner.temp }}/r2-ddl-proof/*.stdout
            ${{ runner.temp }}/r2-ddl-proof/*.stderr
            ${{ runner.temp }}/r2-ddl-proof/capture/**
            ${{ runner.temp }}/r2-ddl-proof/ddl-window/**
            ${{ runner.temp }}/r2-ddl-proof/daemon-logs/**
            ${{ runner.temp }}/r2-ddl-proof/fresh-target/tmp/readiness-diagnostics/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
