name: Unchanged fixed-source physical regressions (no publish)
on:
  push:
    branches: ['ci/4420-wal-tail-regressions-*']
permissions:
  contents: read
jobs:
  proof:
    name: ${{ matrix.configuration }} unchanged native physical regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        configuration: [default, internal, persistent]
    steps:
      - name: Preserve Git source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 24787ceebc36e4809495dbef7d1b7f3978209ad9
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config libssl-dev cmake ninja-build
          dpkg-query -W -f='${Package}\t${Version}\n' > "$RUNNER_TEMP/wal-tail-regressions-packages.txt"
      - name: Verify fixed controller and model
        working-directory: controller
        run: |
          python3 - <<'PYBOOT'
          import hashlib
          from pathlib import Path
          pairs = {
              '.github/4420-wal-tail-regressions/controller.py': '2aa6b5645d4e347b97bab17f1a0c96ff69d553472597b2af4f88f0d0527cf97d',
              '.github/4420-wal-tail-regressions/model.json': 'd36c1d46adae212072c539a148268e0639106920c1f449ed6bae6ea6fcc0f8ab',
          }
          for name, wanted in pairs.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != wanted:
                  raise SystemExit('physical-regression bootstrap mismatch: ' + name)
          PYBOOT
      - name: Build, list and execute unchanged native regressions
        env:
          NANO_WAL_TAIL_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/gpc/HDB/sprint/coordination
          touch /home/gpc/HDB/sprint/coordination/build.lock
          nano_wal_regression_unit="nano-wal-tail-regressions-${GITHUB_RUN_ID}-${NANO_WAL_TAIL_CONFIGURATION}"
          sudo systemd-run --unit "$nano_wal_regression_unit" --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE/controller" \
            -p MemoryMax=24G -p MemorySwapMax=0 -p KillMode=control-group \
            -p RuntimeMaxSec=7500 -p TimeoutStopSec=30 \
            --setenv="PATH=$PATH" --setenv="CARGO_HOME=$HOME/.cargo" \
            --setenv="RUSTUP_HOME=$HOME/.rustup" --setenv=RUSTUP_TOOLCHAIN=1.95.0 \
            --setenv="GITHUB_SHA=$GITHUB_SHA" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=PYTHONUNBUFFERED=1 \
            python3 .github/4420-wal-tail-regressions/controller.py \
              --controller "$GITHUB_WORKSPACE/controller" --product "$GITHUB_WORKSPACE/product" \
              --configuration "$NANO_WAL_TAIL_CONFIGURATION" --out "$RUNNER_TEMP/wal-tail-regressions-$NANO_WAL_TAIL_CONFIGURATION" \
              --model-sha256 d36c1d46adae212072c539a148268e0639106920c1f449ed6bae6ea6fcc0f8ab
      - name: Preserve raw native results and promotion lifecycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wal-tail-regressions-${{ matrix.configuration }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wal-tail-regressions-packages.txt
            ${{ runner.temp }}/wal-tail-regressions-${{ matrix.configuration }}/*.json
            ${{ runner.temp }}/wal-tail-regressions-${{ matrix.configuration }}/*.stdout
            ${{ runner.temp }}/wal-tail-regressions-${{ matrix.configuration }}/*.stderr
            ${{ runner.temp }}/wal-tail-regressions-${{ matrix.configuration }}/promotion-daemon-logs/**
            ${{ runner.temp }}/wal-tail-regressions-${{ matrix.configuration }}/fresh-target/tmp/readiness-diagnostics/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  all-configurations:
    name: All three unchanged physical regression configurations required
    if: always()
    needs: proof
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a partial or invalid regression matrix
        env:
          PROOF_RESULT: ${{ needs.proof.result }}
        run: |
          test "$PROOF_RESULT" = success
