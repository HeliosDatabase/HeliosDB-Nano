name: Paired physical-layout error proof (no publish)
on:
  push:
    branches: ['ci/4420-layout-error-proof-*']
permissions:
  contents: read
jobs:
  proof:
    name: ${{ matrix.role }} exact three native regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: baseline
            product: a7c31f67b5137d399829b5cce1367a18e16a13ea
          - role: fixed
            product: 5451dd091cebebc3dd6bf10900f3f19a53686a5f
    steps:
      - name: Preserve Git source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.product }}
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config libssl-dev cmake ninja-build
          dpkg-query -W -f='${Package}\t${Version}\n' > "$RUNNER_TEMP/layout-proof-packages.txt"
      - name: Verify fixed controller and model
        working-directory: controller
        run: |
          python3 - <<'PYBOOT'
          import hashlib
          from pathlib import Path
          pairs = {
              '.github/4420-layout-error-proof/controller.py': 'b50f0b78f720c53704550f5777894e1a39383924f3fbc1f6f797416e5a195402',
              '.github/4420-layout-error-proof/model.json': '1d02bcc44e0c4cd9813d5eb2a2b2d621c76985d7b63b388b7470677794ac6da1',
          }
          for name, wanted in pairs.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != wanted:
                  raise SystemExit('paired-proof bootstrap mismatch: ' + name)
          PYBOOT
      - name: Build, list and execute the exact three native tests
        env:
          NANO_LAYOUT_PROOF_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/gpc/HDB/sprint/coordination
          touch /home/gpc/HDB/sprint/coordination/build.lock
          nano_layout_unit="nano-layout-proof-${GITHUB_RUN_ID}-${NANO_LAYOUT_PROOF_ROLE}"
          sudo systemd-run --unit "$nano_layout_unit" --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE/controller" \
            -p MemoryMax=24G -p MemorySwapMax=0 -p KillMode=control-group \
            -p RuntimeMaxSec=3900 -p TimeoutStopSec=30 \
            --setenv="PATH=$PATH" --setenv="CARGO_HOME=$HOME/.cargo" \
            --setenv="RUSTUP_HOME=$HOME/.rustup" --setenv=RUSTUP_TOOLCHAIN=1.95.0 \
            --setenv="GITHUB_SHA=$GITHUB_SHA" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=PYTHONUNBUFFERED=1 \
            python3 .github/4420-layout-error-proof/controller.py \
              --controller "$GITHUB_WORKSPACE/controller" --product "$GITHUB_WORKSPACE/product" \
              --role "$NANO_LAYOUT_PROOF_ROLE" --out "$RUNNER_TEMP/layout-proof-$NANO_LAYOUT_PROOF_ROLE" \
              --model-sha256 1d02bcc44e0c4cd9813d5eb2a2b2d621c76985d7b63b388b7470677794ac6da1
      - name: Preserve raw focused proof (including expected-red baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-error-proof-${{ matrix.role }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/layout-proof-packages.txt
            ${{ runner.temp }}/layout-proof-${{ matrix.role }}/*.json
            ${{ runner.temp }}/layout-proof-${{ matrix.role }}/*.stdout
            ${{ runner.temp }}/layout-proof-${{ matrix.role }}/*.stderr
            ${{ runner.temp }}/layout-proof-${{ matrix.role }}/native-libtest.elf
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  both-roles:
    name: Both focused role proofs required (no release acceptance)
    if: always()
    needs: proof
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a partial or invalid pair
        env:
          PROOF_RESULT: ${{ needs.proof.result }}
        run: |
          test "$PROOF_RESULT" = success
