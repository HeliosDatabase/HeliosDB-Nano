name: Release to crates.io

on:
  push:
    tags:
      - 'v*'
  # Manual run: (re)publish the container image for an EXISTING release from
  # its attached binaries. Only the docker-image job runs; nothing is
  # rebuilt, published to crates.io or attached to the release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish as a container image (e.g. v4.41.0)'
        required: true
        type: string
      latest:
        description: 'Also move :latest (auto = only if this is the newest non-prerelease release)'
        required: false
        default: auto
        type: choice
        options: [auto, 'true', 'false']

permissions:
  contents: write       # needed to create the GitHub Release

jobs:
  publish:
    name: Test, verify tag, publish, release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so we can read CHANGELOG

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # rust-toolchain.toml pins channel + components automatically

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      # ── Sanity gate 1: the git tag must match Cargo.toml version ───────────
      # Catches the common mistake of tagging a commit whose Cargo.toml hasn't
      # been bumped (or vice-versa). Tag is read from GITHUB_REF (refs/tags/vX.Y.Z),
      # version from `cargo metadata` (one source of truth, no awk on Cargo.toml).
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
                     | jq -r '.packages[] | select(.name=="heliosdb-nano") | .version')
          echo "tag:      $tag"
          echo "manifest: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      # ── Sanity gate 2: lib + doc tests pass on the tagged commit ──────────
      # Scope: `--lib` (1700+ unit tests) + `--doc` (rustdoc examples).
      # Excludes integration tests in `tests/`: several rely on TCP-port
      # spin-waits or short timeouts that fire spuriously on GH's 2-CPU
      # runner. They pass locally and form a separate (non-release-gating)
      # signal — keeping them out of the release path keeps the gate
      # deterministic.
      - name: Run lib unit tests
        run: cargo test --locked --lib -- --test-threads=2

      - name: Run doc tests
        run: cargo test --locked --doc -- --test-threads=2

      # ── Sanity gate 3: dry-run publish to catch metadata / packaging issues
      # before the real publish (real publish is irreversible — versions can be
      # yanked but never deleted).
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

      # ── The actual publish ────────────────────────────────────────────────
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      # ── Create a GitHub Release with notes pulled from CHANGELOG.md ───────
      # Looks for a `## [X.Y.Z] - YYYY-MM-DD` heading and includes the body
      # up to the next `## ` heading.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See CHANGELOG.md for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # v2 is the current major of action-gh-release (Node 20+ runtime).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # e.g. v3.23.0-rc.1

  # ═══════════════════════════════════════════════════════════════════════
  # Prebuilt release binaries (roadmap item D2).
  #
  # Target matrix notes:
  #   * rocksdb (librocksdb-sys) compiles C++ and generates bindings with
  #     bindgen, so every runner needs clang/libclang. Linux runners get it
  #     via apt; macOS ships Apple clang; Windows images preinstall LLVM
  #     (we export LIBCLANG_PATH so bindgen finds it).
  #   * aarch64 Linux builds NATIVELY on GitHub's ubuntu-24.04-arm runner —
  #     no cross-rs/QEMU needed, identical steps to x86_64.
  #   * musl targets (x86_64/aarch64-unknown-linux-musl) are INTENTIONALLY
  #     SKIPPED for now: reqwest's default native-tls stack pulls in
  #     openssl-sys, which does not build for *-musl without a vendored
  #     OpenSSL + musl-gcc setup. Revisit once the release build moves to a
  #     rustls-only feature set (tracked in ROADMAP_FASTEST_ACID_HTAP.md, D2).
  #   * Binaries link the runner's glibc (ubuntu-24.04 → glibc 2.39); older
  #     distros (Debian 11, Ubuntu 20.04) need the source/docker channels.
  #
  # Runs after the publish job (which is also the test gate: lib + doc
  # tests run there before anything is published or attached).
  # ═══════════════════════════════════════════════════════════════════════
  build-binaries:
    name: Binary (${{ matrix.target }})
    needs: publish
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one failing cell must not block the other artifacts
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            # Windows port: unix-only code paths are cfg(unix)-gated as of
            # fix/windows-port; verified via a full
            # `cargo check --bins --lib --target x86_64-pc-windows-gnu`
            # cross-check (mingw). This msvc cell is now a regular,
            # blocking matrix cell — fail-fast is already false, so a
            # failure here cannot block the other artifacts.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # bindgen (librocksdb-sys) needs libclang; openssl-sys (via reqwest's
      # native-tls) needs OpenSSL headers on Linux. macOS uses
      # Security.framework and Windows uses SChannel, so only Linux needs
      # the ssl dev package.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev

      - name: Point bindgen at preinstalled LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Archive layout is FLAT (binary + LICENSE + README.md at the archive
      # root) — [package.metadata.binstall] in Cargo.toml relies on this
      # (bin-dir = "{ bin }{ binary-ext }"). Keep naming in sync with the
      # binstall pkg-url template and scripts/install.sh:
      #   heliosdb-nano-vX.Y.Z-<target>.{tar.gz|zip}
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          name="heliosdb-nano-v${version}-${target}"
          bin="target/${target}/release/heliosdb-nano"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="${bin}.exe"
          fi
          mkdir -p stage dist
          cp "$bin" LICENSE README.md stage/
          # Members are added by explicit name (no ./ prefix) so consumers
          # can extract by exact member name (install.sh, docker-image job).
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd stage && 7z a "../dist/${name}.zip" heliosdb-nano.exe LICENSE README.md)
          else
            tar -C stage -czf "dist/${name}.tar.gz" heliosdb-nano LICENSE README.md
          fi
          ls -l dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Collect every built archive, write one SHA256SUMS covering all of them,
  # and attach everything to the GitHub Release created by the publish job.
  # `if: !cancelled()` so that a single failed matrix cell (most likely the
  # Windows or aarch64 cell on the first run) still ships the artifacts
  # that DID build.
  attach-binaries:
    name: Attach binaries to GitHub Release
    needs: [publish, build-binaries]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum heliosdb-nano-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        # Same tag as the release created in the publish job: this appends
        # assets to that release rather than creating a new one.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/heliosdb-nano-*
            dist/SHA256SUMS

  # ═══════════════════════════════════════════════════════════════════════
  # Official container image, multi-arch (linux/amd64 + linux/arm64), built
  # from the release's own prebuilt Linux binaries (Dockerfile.binary — no
  # in-container compile) and pushed to GHCR:
  #
  #   ghcr.io/heliosdatabase/heliosdb-nano:X.Y.Z   (also :vX.Y.Z and :X.Y)
  #   ghcr.io/heliosdatabase/heliosdb-nano:latest  (newest stable release only)
  #
  # The binaries are downloaded from the GitHub Release and checked against
  # its SHA256SUMS, so a tag push and a manual workflow_dispatch for an older
  # release produce the image the same way. The OCI `source` label links the
  # GHCR package to this repository.
  # ═══════════════════════════════════════════════════════════════════════
  docker-image:
    name: Docker image → ghcr.io
    needs: [publish, attach-binaries]
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
          || (needs.publish.result == 'success' && needs.attach-binaries.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/heliosdatabase/heliosdb-nano
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::not a release tag: $tag"; exit 1
          fi
          version="${tag#v}"
          minor="$(echo "$version" | cut -d. -f1,2)"
          newest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          latest="${INPUT_LATEST:-auto}"
          if [ "$latest" = "auto" ] || [ -z "$latest" ]; then
            if [ "$tag" = "$newest" ] && [ "$version" = "${version%%-*}" ]; then latest=true; else latest=false; fi
          fi
          tags="${IMAGE}:${version},${IMAGE}:${tag}"
          # Floating X.Y tag only for stable releases
          if [ "$version" = "${version%%-*}" ]; then tags="${tags},${IMAGE}:${minor}"; fi
          if [ "$latest" = "true" ]; then tags="${tags},${IMAGE}:latest"; fi
          echo "tag=$tag"           >> "$GITHUB_OUTPUT"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "tags=$tags"         >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version newest=$newest latest=$latest"
          echo "tags=$tags"

      # Tag push: the tagged tree. Manual run: the dispatched branch (main),
      # so older releases get the current Dockerfile + entrypoint.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download + verify release binaries
        id: bins
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          mkdir -p dl
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern "heliosdb-nano-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
            --pattern "heliosdb-nano-${tag}-aarch64-unknown-linux-gnu.tar.gz" \
            --pattern SHA256SUMS
          (cd dl && grep -E "linux-gnu\.tar\.gz$" SHA256SUMS | sha256sum -c -)
          platforms=""
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"; target="${pair#*:}"
            archive="dl/heliosdb-nano-${tag}-${target}.tar.gz"
            [ -f "$archive" ] || { echo "::error::missing $archive"; exit 1; }
            mkdir -p "target/docker/${arch}"
            tar -xzf "$archive" -C "target/docker/${arch}" heliosdb-nano
            platforms="${platforms:+$platforms,}linux/${arch}"
          done
          ls -l target/docker/*/
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 apt layer)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.binary
          platforms: ${{ steps.bins.outputs.platforms }}
          push: true
          provenance: false
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.v.outputs.created }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=HeliosDB Nano — embedded-or-server SQL database (PostgreSQL + MySQL wire protocols)
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - name: Smoke test the pushed image
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ steps.v.outputs.version }}"
          docker run --rm "$ref" --version | grep -F "${{ steps.v.outputs.version }}"
          docker run -d --name nano-smoke -e HELIOSDB_PASSWORD=smoke-test -p 127.0.0.1:55432:5432 "$ref"
          for _ in $(seq 1 30); do
            if PGPASSWORD=smoke-test psql "host=127.0.0.1 port=55432 user=postgres sslmode=require" -tAc 'SELECT 1' 2>/dev/null | grep -qx 1; then
              echo "SELECT 1 over TLS + scram: ok"; docker rm -f nano-smoke; exit 0
            fi
            sleep 2
          done
          docker logs nano-smoke; exit 1
